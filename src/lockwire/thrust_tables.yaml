# Cited motor + prop thrust tables, consumed by `lockwire fly`. Not the contract schema.
#
# Each table is the maker's own bench test as printed: rows are [throttle %, thrust g, current A,
# power W] at the stated test voltage. Read from the raw HTML of each URL on 2026-11-09 (not a
# summary). motor_mass_g is the maker's weight excluding cables; max_continuous_a is the maker's
# "Max Continuous Current 180S" (null where the page gives none). The cited/unverified label is
# worked out by the catalog rule (catalog.is_cited), never typed in.
#
# A lockfile names a table from its motor's device model: `thrust_table: <id>`.
# Left out: Holybro 2216-920KV (the X500 V2 motor). Holybro publishes no thrust table for it.

