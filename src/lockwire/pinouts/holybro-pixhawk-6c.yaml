# Pinout card, converted by script from the checked staging file; every figure read 2026-11-13.
id: holybro-pixhawk-6c
name: Holybro Pixhawk 6C
maker: Holybro
numbers:
  power_normal_min:
    value: 4.9
    unit: V
    kind: datasheet
    source: 'https://docs.px4.io/main/en/flight_controller/pixhawk6c.html (Holybro Pixhawk 6C | PX4 Guide (main): "POWER1 and POWER2 inputs (4.9V to 5.5V)"; read at the PX4 Pixhawk 6C page), read 2026-11-13'
  power_normal_max:
    value: 5.5
    unit: V
    kind: datasheet
    source: 'https://docs.px4.io/main/en/flight_controller/pixhawk6c.html (Holybro Pixhawk 6C | PX4 Guide (main): "POWER1 and POWER2 inputs (4.9V to 5.5V)"; read at the PX4 Pixhawk 6C page), read 2026-11-13'
  power_abs_max_undamaged:
    value: 10
    unit: V
    kind: datasheet
    source: 'https://docs.px4.io/main/en/flight_controller/pixhawk6c.html (Holybro Pixhawk 6C | PX4 Guide (main): "POWER1 and POWER2 inputs (operational range 4.1V to 5.7V, 0V to 10V undamaged)"; read at
      the PX4 Pixhawk 6C page), read 2026-11-13'
  usb_normal_min:
    value: 4.75
    unit: V
    kind: datasheet
    source: 'https://docs.px4.io/main/en/flight_controller/pixhawk6c.html (Holybro Pixhawk 6C | PX4 Guide (main): "USB input (4.75V to 5.25V)"; read at the PX4 Pixhawk 6C page), read 2026-11-13'
  usb_normal_max:
    value: 5.25
    unit: V
    kind: datasheet
    source: 'https://docs.px4.io/main/en/flight_controller/pixhawk6c.html (Holybro Pixhawk 6C | PX4 Guide (main): "USB input (4.75V to 5.25V)"; read at the PX4 Pixhawk 6C page), read 2026-11-13'
  servo_rail_abs_max_undamaged:
    value: 42
    unit: V
    kind: datasheet
    source: 'https://docs.px4.io/main/en/flight_controller/pixhawk6c.html (Holybro Pixhawk 6C | PX4 Guide (main): "Servo input: VDD_SERVO pin of FMU PWM OUT and I/O PWM OUT (0V to 42V undamaged)"; read
      at the PX4 Pixhawk 6C page), read 2026-11-13'
note: TELEM2 = UART5 (/dev/ttyS3) per PX4 serial map and Holybro ports page. PX4 docs say TELEM1 alone, Holybro says TELEM1+GPS2 share the 1.5 A limiter; left empty. POWER2 and CAN2 pin names not read.
  FMU PWM-OUT must be powered separately (PX4 quick start). PWM signal is hardware switchable 3.3 V or 5 V.
