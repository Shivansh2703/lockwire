    unit: V
    kind: datasheet
    source: 'https://docs.arduino.cc/resources/datasheets/A000066-datasheet.pdf (Arduino UNO R3 User Manual, SKU A000066 (modified 12/11/2026): "Maximum input voltage from USB connector 5.5 V"; as stated),
      read 2026-11-13'
note: VIH min = 0.7*VCC for general I/O at VCC 2.4-5.5 V; 0.6*VCC applies only to XTAL1 and RESET pins. VIL max = 0.3*VCC, pin abs max = VCC+0.5 V (not single numbers).
