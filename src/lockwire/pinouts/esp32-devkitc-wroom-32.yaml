- id: J2
  source: 'https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32/esp32-devkitc/user_guide.html (ESP32-DevKitC V4 - ESP32 - esp-dev-kits latest documentation: J2 header table)'
