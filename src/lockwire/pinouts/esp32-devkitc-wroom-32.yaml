# Pinout card, converted by script from the checked staging file; every figure read 2026-11-13.
id: esp32-devkitc-wroom-32
name: ESP32-DevKitC V4 (ESP32-WROOM-32)
maker: Espressif
numbers:
  gpio_total_abs_max:
    value: 1200
    unit: mA
    kind: datasheet
    source: 'https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf (ESP32 Series Datasheet Version 5.3: "Cumulative IO output current 1200 mA"; chip absolute maximum (ESP32
      series DS v5.3); WROOM-32 module datasheet v3.8 says 1,100 mA), read 2026-11-13'
  gpio_per_pin_source_typ:
    value: 40
    unit: mA
    kind: datasheet
    source: 'https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf (ESP32 Series Datasheet Version 5.3: "High-level source current 40 mA"; typical, VDD=3.3 V, VOH>=2.64 V, drive
      strength max, VDD3P3_CPU/RTC domains; falls to ~29 mA as more pins source (Table 5-3 note 2); VDD_SDIO domain 20 mA typ. Sink IOL 28 mA typ.), read 2026-11-13'
  supply_abs_max:
    value: 3.6
    unit: V
    kind: datasheet
    source: 'https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf (ESP32 Series Datasheet Version 5.3: "Allowed input voltage -0.3 3.6 V"; as stated), read 2026-11-13'
  operating_min:
    value: 3.0
    unit: V
    kind: datasheet
    source: 'https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32_datasheet_en.pdf (ESP32-WROOM-32 Datasheet Version 3.8 (NRND): "Operating voltage/Power supply: 3.0 ~ 3.6 V"; as stated),
      read 2026-11-13'
  operating_max:
    value: 3.6
    unit: V
    kind: datasheet
    source: 'https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32_datasheet_en.pdf (ESP32-WROOM-32 Datasheet Version 3.8 (NRND): "Operating voltage/Power supply: 3.0 ~ 3.6 V"; as stated),
      read 2026-11-13'
note: Datasheet states allowed input voltage -0.3 to 3.6 V and no 5 V tolerance. VIH min 0.75*VDD, VIL max 0.25*VDD, VOH min 0.8*VDD, VOL max 0.1*VDD. GPIO6-11 are wired to the module flash; ADC2 is unusable
  while Wi-Fi runs (ESP-IDF docs).
