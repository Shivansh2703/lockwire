# Whole robots with vendor-published numbers, for `check_datasheet_agreement`. NOT the contract
# schema — see catalog.py. Rules (enforced by catalog.Robot and tests/test_catalog.py):
#   - every number is kind: datasheet; `assumed` is refused for robot rows;
#   - `source` starts with the URL that was opened, then the sheet's own words;
#   - `retrieved` is the day it was opened; mass_total says what the sheet's figure includes
#     (`scope`: with_battery | dry | with_gripper | with_cable | arm_only).
# `aliases` are exact URDF <robot name> values; `fingerprint` is the description package's link
# names (>= 80 % Jaccard overlap recognises; a tie recognises nothing).
# `known_urdf_deviations` entries are "<quantity>: <why>" and suppress that quantity.

robots:
- id: ur3e
  name: Universal Robots UR3e
  aliases: [ur3e]
  fingerprint: &ur_links [base, base_link, base_link_inertia, shoulder_link, upper_arm_link,
    forearm_link, wrist_1_link, wrist_2_link, wrist_3_link, flange, tool0, ft_frame]
  numbers:
    mass_total: {value: 11.2, unit: kg, kind: datasheet, scope: with_cable, retrieved: 2026-11-04,
      source: "https://www.universal-robots.com/media/1807464/ur3e_e-series_datasheets_web.pdf — Weight including cable 11,2 kg"}
    dof: {value: 6, unit: count, kind: datasheet, retrieved: 2026-11-04,
      source: "https://www.universal-robots.com/media/1807464/ur3e_e-series_datasheets_web.pdf — Degrees of freedom 6 rotating joints"}
    reach_m: {value: 0.5, unit: m, kind: datasheet, retrieved: 2026-11-04,
      source: "https://www.universal-robots.com/media/1807464/ur3e_e-series_datasheets_web.pdf — Reach 500 mm"}
    payload_kg: {value: 3, unit: kg, kind: datasheet, retrieved: 2026-11-04,
      source: "https://www.universal-robots.com/media/1807464/ur3e_e-series_datasheets_web.pdf — Payload 3 kg"}
