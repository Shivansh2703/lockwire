# HTD 3M and 5M pitch: Gates Light Power & Precision Drive Design Manual (gates.com PDF).
belt_profiles:
  - profile: 2GT
    aliases: ["GT2"]
    pitch: 0.002
    source: "https://uk.misumi-ec.com/files/images/products/docs/conveyertimingbelts.pdf (Misumi timing belt catalogue PDF on Misumi's own domain: \"Type: 2GT (Pitch: 2mm)\"; printed 2 mm), read 2026-11-13"
  - profile: 3GT
    aliases: ["GT3"]
    pitch: 0.003
    source: "https://uk.misumi-ec.com/files/images/products/docs/conveyertimingbelts.pdf (Misumi timing belt catalogue PDF on Misumi's own domain: \"Type: 3GT (Pitch: 3mm)\"; printed 3 mm), read 2026-11-13"
  - profile: MXL
    aliases: []
    pitch: 0.002032
    source: "https://uk.misumi-ec.com/files/images/products/docs/conveyertimingbelts.pdf (Misumi timing belt catalogue PDF on Misumi's own domain: \"Type: MXL (Pitch: 2.032mm)\"; printed 2.032 mm), read 2026-11-13"
  - profile: HTD 3M
    aliases: ["3M", "HTD3M"]
    pitch: 0.003
    source: "https://www.gates.com/content/dam/documents-library/catalogs/light-power-and-precision-manual.pdf (Gates Light Power & Precision Drive Design Manual: \"Gates 3mm and 5mm pitch HTD belts are capable of operating at both low and high speeds\"; printed 3 mm), read 2026-11-13"
  - profile: HTD 5M
    aliases: ["5M", "HTD5M"]
    pitch: 0.005
    source: "https://www.gates.com/content/dam/documents-library/catalogs/light-power-and-precision-manual.pdf (Gates Light Power & Precision Drive Design Manual: \"Gates 3mm and 5mm pitch HTD belts are capable of operating at both low and high speeds\"; printed 5 mm), read 2026-11-13"

# Availability records exist only where the maker's own page states the status, read 2026-11-13.
# Every other part reads as "not checked"; nothing is assumed active.
availability:
- part: pololu.d24v60f5
  status: discontinued
  replaced_by: Pololu D24V90F5 (5V 9A step-down regulator)
  source: 'https://www.pololu.com/product/2865 (Pololu product page: "This product has been replaced by the 5V, 9A Step-Down Voltage Regulator D24V90F5")'
  read_on: 2026-11-13
- part: ti.drv8833
  status: active
  replaced_by: null
  source: 'https://www.ti.com/lit/ds/symlink/drv8833.pdf (TI orderable-parts table: "DRV8833PWPR Active Production HTSSOP (PWP)"; the PW TSSOP orderable is listed Obsolete)'
  read_on: 2026-11-13

