      value: 4.75
      unit: V
      kind: datasheet
      source: NVIDIA Jetson Orin NX series data sheet DS-10712-001 Table 5-1 (VDD_IN, MODULE_ID
        low = legacy 5 V module), https://developer.nvidia.com/downloads/jetson-orin-nx-module-series-data-sheet;
        the Orin Nano dev-kit carrier spec SP-11324-001 says VDD_IN is 5 V only; read 2026-10-15
    input_voltage_max:
      value: 5.25
