# The starter parts catalog. NOT the contract schema (frozen) — see catalog.py.
#
# Two kinds of number live here, and every one says which it is:
#   kind: datasheet     - a manufacturer datasheet/spec-page/product-listing figure, cited.
#   kind: source_file   - a real number read out of a file already in this repo (a vendor URDF's
#                         own <mass> tag); real, but the citation is a file, not a datasheet.
#   kind: assumed       - fabricated for seeding. No real part backs this number. The source string
#                         says so in plain words — never presented as if it were measured.
#
# The 13 "x500.*" parts and their numbers are carried over verbatim from
# tests/fixtures/x500/contract.yaml's device_models/devices (each already witnessed there,
# locked_at dates and citations preserved). The 6 "anymal.*" parts are read from the masses in
# tests/fixtures/anymal_d.urdf. Everything else ("generic.*") is a labelled placeholder so the
# catalog covers common part families a user might reach for; replace before relying on it.

parts:
# Part bodies and frames (origin convention: catalog.py). Servos with NO frame, and why:
#   - the 13 ROBOTIS X/MX parts: the drawing download redirects to an error page.
#   - the Feetech parts (st3215, sts3215, sts3250, scs0009): the shaft is dimensioned from an
#     inner gear line, not a case edge.
#   - hitec.hs-422, hitec.hs-645mg: the shaft is dimensioned from a tab end and tab symmetry is
#     not stated.
#   - hitec.d645mw: the maker page is unreachable.
#   - feetech.sts3032: length and width are only in the spec table, so it has no body either.
#   - dynamixel.ax-12a: horn x only; its height is ambiguous on the drawing, so no body, no y/z.
