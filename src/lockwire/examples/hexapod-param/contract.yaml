# Power-focused hexapod: a body plate and six 3-joint legs (coxa, femur, tibia) stored in this lockfile, sized by the
# named numbers under `params:`. Change a leg length (`coxa_length`, `femur_length`, `tibia_length`) and the derived
# link masses and the joint torques move; change a `body_*` size and the plate mass follows its volume.
# Every size and position is a design choice, not a maker spec. Links are solid 6061-T6 aluminium boxes, so every link
# mass is derived from the shapes and the cited density in `material.source` (lockwire.catalog row "Aluminium 6061-T6").
# Power: 18 Feetech ST3215 servos (catalog feetech.st3215) on one Gens ace 2200 mAh 3S 35C pack
# (catalog pack.gensace.3s-2200-35c-bashing). Servo mass, stall and no-load currents, torques and the pack's
# mAh, cell count, C ratings and mass are copied from those catalog rows with their sources.
# The pack's 11.1 V nominal and the Wh and W derived from it are the maker's product-title figure, not a catalog number.
# Each servo joint carries the catalog's peak stall torque as its effort limit and the catalog's 360 deg rotation_range as its
# lower/upper span (centred on zero; the maker states no stops). Velocity is left out.
schema_version: '0.2'
