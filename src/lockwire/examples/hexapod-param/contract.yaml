    note: 'Catalog row feetech.st3215 (Feetech ST-3215-C018 spec): operating voltage 4-14 V, stall current
      2.7 A@12V, no-load current 180 mA@12V, peak stall torque 30 kg.cm@12V = 2.942 N*m, rated torque
      10 kg.cm@12V = 0.981 N*m.'
