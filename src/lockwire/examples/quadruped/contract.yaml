# Quadruped starter: the Open Dynamic Robot Initiative's Solo-12, 12 actuators on one 24 V bench supply.
# Based on Solo-12 (BSD-3-Clause, https://github.com/open-dynamic-robot-initiative/open_robot_actuator_hardware;
# 3D body from https://github.com/open-dynamic-robot-initiative/robot_properties_solo, see NOTICE).
#
# Deliberate real-world finding (ODRI maintainer, open_robot_actuator_hardware issue #42): a builder
# sizes the supply from the average draw (3-5 A at 24 V) and buys the smaller listed lab supply, a
# 20 A one. The maintainer: "all the motors will draw a high current at the same instance" on a jump,
# the voltage sags, and below 8 V the motor-driver microcontrollers reset (ODRI used a 30 A supply).
# `lockwire check` on this file ends NO-GO: 12 x 56.55 W = 678.6 W peak against 24 V x 20 A = 480 W.
# NO-GO holds even on this lower bound.
# The walking budget (96 W) passes; only the jump budget fails. Master board, micro-driver boards and
# IMU draw are not published in the ODRI repos read, so they are left out (not guessed).
