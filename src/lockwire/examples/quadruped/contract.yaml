families:
  - id: fam.actuator.module
    name: Brushless actuator module with micro-driver channel
device_models:
  - id: mdl.actuator.odri-4004-9to1
    family: fam.actuator.module
    provenance:
      witness: w0
      source: "github.com/open-dynamic-robot-initiative/open_robot_actuator_hardware mechanics/actuator_module_v1/README.md; electronics/micro_driver_electronics/README.md; arxiv.org/abs/1910.00093"
      locked_at: 2026-10-15
      note: "T-Motor Antigravity 4004 300KV, dual-stage timing belt 3:1 x 3:1 = 9:1 (actuator README; paper II-A). Paper: k_i = 0.025 N m/A, tau_joint = 0.225 i, tau_max = 2.7 N m at 12 A. Micro-driver board input 5-32 V, 'we operate our robots at 24 V' (micro-driver README), used as the input range."
    input_voltage_range:
      min: {value: 5, unit: V}
      max: {value: 32, unit: V}
devices:
  - id: dev.motor.front-left-hip-abduction
    model: mdl.actuator.odri-4004-9to1
    power:
      rail: rail.bench-supply-24v
      draw: {value: 56.55, unit: W}
      modes:
        - name: "walk"
          draw: {value: 8, unit: W}
        - name: "jump"
          draw: {value: 56.55, unit: W}
    physical:
      mount_frame: FL_SHOULDER
    owner: you
    provenance:
      witness: human
      source: "author-chosen: peak-power model from ODRI figures; walk from open_robot_actuator_hardware issue #42"
      locked_at: 2026-10-15
      note: "ODRI publishes no peak power per actuator. Jump 56.55 W is a lower bound on electrical draw: ideal mechanical output at the 12 A torque limit 2.7 N m and half no-load speed (300 rpm/V x 24 V / 9 = 83.78 rad/s), 2.7 x 83.78 / 4 = 56.55 W, losses ignored; electrical input is higher. The paper's 12 A x 24 V = 288 W per actuator is the outer ceiling. Walk: maintainer says average draw is typically 3-5 A at 24 V (issue #42); 4 A x 24 V = 96 W, / 12 = 8 W."
