topology:
  rails:
    - id: rail.supply-12v
      voltage: {value: 12, unit: V}
      capacity: {value: 60, unit: W}
      current_limit: {value: 5, unit: A}
      provenance:
        witness: w0
        source: "github.com/TheRobotStudio/SO-ARM100 README.md (Bill of Materials, follower-arm note); https://github.com/TheRobotStudio/SO-ARM100/issues/132"
        locked_at: 2026-10-15
        note: "README: 'you will also have to buy a 12V 5A+ power supply'; issue #132 builds on 12 V / 5 A. 12 V x 5 A = 60 W. The README's 5A+ is a minimum, this starter uses the 5 A case."
budgets:
  - id: bud.supply-12v-stall
    kind: rail_power
    rail: rail.supply-12v
    limit: {value: 60, unit: W}
    draw_mode: "stall"
    owner: you
    provenance:
      witness: w0
      source: "github.com/TheRobotStudio/SO-ARM100 README.md (Bill of Materials, follower-arm note); https://github.com/TheRobotStudio/SO-ARM100/issues/132"
      locked_at: 2026-10-15
      note: "Budget equals the supply rating: 12 V x 5 A = 60 W. Scored in the servos' stall mode: 6 x 2.7 A x 12 V = 194.4 W; 3 servos at stall = 97.2 W already exceed it."
  - id: bud.supply-12v-no-load
    kind: rail_power
    rail: rail.supply-12v
    limit: {value: 60, unit: W}
    draw_mode: "no-load"
    owner: you
