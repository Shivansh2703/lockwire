# SO-101 robot arm starter: six Feetech STS3215 servos (12 V, 30 kg.cm version)
# on a Waveshare bus servo adapter, powered from one 12 V 5 A wall supply.
# Based on SO-101 by TheRobotStudio (Apache-2.0, https://github.com/TheRobotStudio/SO-ARM100).
#
# `lockwire check` ends NO-GO: the 60 W supply (12 V x 5 A) fails the stall-mode budget. The
# real scenario is several joints holding or accelerating against load, not literally all six
# stalled (issue #132). Derived: 3 of the 6 servos at stall (97.2 W) already exceed the 60 W
# supply (3 x 2.7 A x 12 V); all six at stall is 194.4 W. The no-load budget (6 x 2.4 = 14.4 W)
# passes. This is the failure real builders report:
#   https://github.com/TheRobotStudio/SO-ARM100/issues/132
#   "Daisy chaining power and using a 5A 12V power supply seems insufficient for full
#    utilization" (voltage sag / brown-outs, servo resets, hot jumpers). The project's own
#   README tells builders of the 12 V version to buy a "12V 5A+" supply.
# Related reports: issue #142 (Waveshare board input is 9-12.6 V, builders ask which
# supply to use) and issue #174 (7.4 V servos on a 12 V supply).
#
# Provenance notes: the STS3215 stall current (2.7 A at 12 V) is retailer-sourced
# (Waveshare listing, not the manufacturer Feetech). Servo mass and the adapter board's own
# current draw are not published at the sources used, so they are left out.
