    name: Bus servo adapter
device_models:
  - id: mdl.servo.sts3215-12v
    family: fam.servo.bus
    provenance:
      witness: w0
      source: "https://www.waveshare.com/st3215-servo.htm; github.com/TheRobotStudio/SO-ARM100 README.md (Bill of Materials, follower-arm note)"
      locked_at: 2026-10-15
      note: "STS3215 12 V version: operating voltage 6-12.6 V, 30 kg.cm at 12 V, no-load current 200 mA, locked-rotor current 2.7 A (Waveshare retailer listing, not manufacturer). The README says the 12 V version has 30 kg.cm stall torque; the 7.4 V version is 16.5 kg.cm at 6 V."
    input_voltage_range:
      min: {value: 6, unit: V}
      max: {value: 12.6, unit: V}
  - id: mdl.controller.waveshare-bus-servo-adapter-a
    family: fam.controller.servo-adapter
    provenance:
      witness: w0
      source: "https://www.waveshare.com/bus-servo-adapter-a.htm"
      locked_at: 2026-10-15
      note: "Power supply DC 9-12.6 V (ST series servo), 5.5 x 2.1 mm DC jack; the listing says 'sufficient power supply required'. Current draw of the board itself is not published."
    input_voltage_range:
      min: {value: 9, unit: V}
      max: {value: 12.6, unit: V}
