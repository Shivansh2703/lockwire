# Rover starter: a TurtleBot3 Burger whose Raspberry Pi 4 was swapped for a Jetson Nano.
# Based on ROBOTIS TurtleBot3 Burger (Apache-2.0, https://github.com/ROBOTIS-GIT/turtlebot3).
#
# The stock Burger fits its power budget. This starter carries the common upgrade: the
# Jetson Nano takes over the Pi's slot and is powered the way the Pi was, from the OpenCR's
# 5 V output through the Pi power cable on ONE 40-pin header pin (pin 4). NVIDIA rates one
# 5 V pin of that header at 2.5 A (12.5 W); the Nano plus a USB peripheral can ask for
# 16.25 W. `lockwire check` on this file ends NO-GO: the header pin is over its rating (one finding: the
# rail's current limit, 3.25 A against 2.5 A, which is also 16.25 W against 12.5 W).
# Builders asking about or attempting exactly this swap on the OpenCR 5 V output:
#   https://forums.developer.nvidia.com/t/opencr-nvidia-jetson-nano-developer-kit-b01/119562
#   https://forums.developer.nvidia.com/t/jetson-nano-2gb-turns-off-every-20-mins/211036
# (the second: a Nano 2GB on the OpenCR GPIO power dies exactly 20 minutes after boot; on
# wall power it runs indefinitely). Whether that thread's cause was this limit is not
# established there; the contract only encodes the published pin rating.
# Put the Raspberry Pi 4 back, or feed the Nano's barrel jack (5 V / 4 A), and the check passes.
#
# Labels: every number is "read" from the page named in its provenance on 2026-10-15, except those
# whose note says "assumed" or whose witness is human.
schema_version: "0.2"
robot:
  name: Rover
  id: turtlebot3-burger
model:
  source: https://raw.githubusercontent.com/ROBOTIS-GIT/turtlebot3/90a68bd2e3c61c12966779da89d8eeaec82730e9/turtlebot3_description/urdf/turtlebot3_burger.urdf
  source_sha256: bc453d08d6a3f2da1530201a15807edafffa5158c291dc40f5edb19ae35ca603
  structure_hash: c5eb6fa080cbe3eb16de520883634fded67a1c8738eab82530010832c65c397f
  links:
  - {name: base_footprint}
  - name: base_link
    mass: {value: 0.82573504, unit: kg}
    com: [0.0, 0.0, 0.0]
    frame: base_link
  - name: wheel_left_link
    mass: {value: 0.02849894, unit: kg}
    com: [0.0, 0.0, 0.0]
    frame: wheel_left_link
  - name: wheel_right_link
    mass: {value: 0.02849894, unit: kg}
    com: [0.0, 0.0, 0.0]
    frame: wheel_right_link
  - name: caster_back_link
    mass: {value: 0.005, unit: kg}
    com: [0.0, 0.0, 0.0]
    frame: caster_back_link
  - {name: imu_link}
  - name: base_scan
    mass: {value: 0.114, unit: kg}
    com: [0.0, 0.0, 0.0]
    frame: base_scan
  joints:
  - name: base_joint
    type: fixed
    parent: base_footprint
    child: base_link
    origin:
      xyz: [0.0, 0.0, 0.01]
      rpy: [0.0, 0.0, 0.0]
  - name: wheel_left_joint
    type: continuous
    parent: base_link
    child: wheel_left_link
    origin:
      xyz: [0.0, 0.08, 0.023]
      rpy: [-1.57, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
  - name: wheel_right_joint
    type: continuous
    parent: base_link
    child: wheel_right_link
    origin:
      xyz: [0.0, -0.08, 0.023]
      rpy: [-1.57, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
  - name: caster_back_joint
    type: fixed
    parent: base_link
    child: caster_back_link
    origin:
      xyz: [-0.081, 0.0, -0.004]
      rpy: [-1.57, 0.0, 0.0]
  - name: imu_joint
    type: fixed
    parent: base_link
    child: imu_link
    origin:
      xyz: [-0.032, 0.0, 0.068]
      rpy: [0.0, 0.0, 0.0]
  - name: scan_joint
    type: fixed
    parent: base_link
    child: base_scan
    origin:
      xyz: [-0.032, 0.0, 0.172]
      rpy: [0.0, 0.0, 0.0]
  zero_mass_links: [base_footprint, imu_link]
  provenance:
    witness: w0
    source: https://raw.githubusercontent.com/ROBOTIS-GIT/turtlebot3/90a68bd2e3c61c12966779da89d8eeaec82730e9/turtlebot3_description/urdf/turtlebot3_burger.urdf
    locked_at: 2026-10-15
    note: "Link masses are the <mass> values of turtlebot3_burger.urdf at ROBOTIS-GIT/turtlebot3@90a68bd (humble), read 2026-10-15, namespace argument empty. Links and joints are lockwire's own URDF import of the file after xacro expansion with the namespace empty (lockwire start), with inertia and centre-of-mass columns dropped; structure_hash is of that expanded file, source_sha256 of the raw file. The URDF has no link for the OpenCR or Jetson, so those devices mount on base_link; the motors mount on the wheel link whose geometry their scene node draws."

families:
  - id: fam.controller
    name: Motor controller board
  - id: fam.companion.sbc
    name: Companion computer
  - id: fam.servo.smart
    name: Smart servo
  - id: fam.lidar
    name: 2D lidar
  - id: fam.usb
    name: USB peripheral
device_models:
  - id: mdl.controller.opencr-1-0
    family: fam.controller
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/parts/controller/opencr10/"
      locked_at: 2026-10-15
      note: "Input 5-24 V (battery or SMPS); input fuse 125 V 10 A; outputs 12 V max 4.5 A, 5 V max 4 A, 3.3 V 800 mA; 5 V is supplied from the regulated 12 V, and total consumption on the 12 V and 5 V ports must not exceed 55 W."
  - id: mdl.companion.jetson-nano-devkit
    family: fam.companion.sbc
    provenance:
      witness: w0
      source: "developer.download.nvidia.com/embedded/L4T/r32-3-1_Release_v1.0/Jetson_Nano_Developer_Kit_User_Guide.pdf"
      locked_at: 2026-10-15
      note: "Jetson Nano Developer Kit User Guide DA_09402_003 (Dec 2019). Module needs 4.75 V minimum; default power mode budgets 10 W for the module (the other mode 5 W); carrier board consumes 0.5 W (at 2 A) to 1.25 W (at 4 A) with no peripherals. J41 header: two 5 V pins, each usable to power the kit at 2.5 A."
    input_voltage_range:
      min: {value: 4.75, unit: V}
      max: {value: 5.25, unit: V}
  - id: mdl.servo.xl430-w250
    family: fam.servo.smart
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/dxl/x/xl430-w250/"
      locked_at: 2026-10-15
      note: "Input 6.5-12.0 V (recommended 11.1 V); stall torque 1.4 N.m at 11.1 V, 1.3 A; standby current 52 mA; mass 57.2 g. temperature_c hard limit -5 to 72 C: Robotis e-Manual (read 2026-10-22) Specifications table, 'Operating Temperature -5 ~ +72 [°C]' (https://emanual.robotis.com/docs/en/dxl/x/xl430-w250/); control table row 'Present Temperature' (address 146, read-only, unit C). The Temperature Limit register (row '31 1 Temperature Limit RW 72 0 ~ 100 1 [°C]') is a user-writable shutdown default; the operating range is used as the limit."
    hard_limits:
      temperature_c: {lo: -5, hi: 72, unit: degC, why: "Outside the servo's published operating temperature range"}
  - id: mdl.lidar.lds-02
    family: fam.lidar
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/platform/turtlebot3/appendix_lds_02/"
      locked_at: 2026-10-15
      note: "Operating supply 5 V DC +/-10% (4.5-5.5 V); 240 mA running, 400 mA start-up; mass 131 g."
    input_voltage_range:
      min: {value: 4.5, unit: V}
      max: {value: 5.5, unit: V}
  - id: mdl.usb.nano-stack
    family: fam.usb
    provenance:
      witness: w0
      source: "developer.download.nvidia.com/embedded/L4T/r32-3-1_Release_v1.0/Jetson_Nano_Developer_Kit_User_Guide.pdf"
      locked_at: 2026-10-15
      note: "Each USB 3.0 stack on the dev kit is limited to 1 A total power delivery. Used here as a worst-case stand-in for whatever the builder plugs in (a camera); it is a port limit, not a measured camera."
devices:
  - id: dev.motor-controller
    model: mdl.controller.opencr-1-0
    physical:
      mount_frame: base_link
    owner: you
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/parts/controller/opencr10/"
      locked_at: 2026-10-15
      note: "The board is the source of the 12 V and 5 V rails; it consumes nothing modeled here."
  - id: dev.jetson-nano-computer
    model: mdl.companion.jetson-nano-devkit
    power:
      rail: rail.jetson-header-5v
      draw: {value: 11.25, unit: W}
    physical:
      mount_frame: base_link
    owner: you
    provenance:
      witness: w0
      source: "developer.download.nvidia.com/embedded/L4T/r32-3-1_Release_v1.0/Jetson_Nano_Developer_Kit_User_Guide.pdf"
      locked_at: 2026-10-15
      note: "10 W default module budget + 1.25 W carrier board at 4 A = 11.25 W. Replaces the stock Raspberry Pi 4; powered from the OpenCR 5 V through the Pi power cable on header pin 4 (assumed wiring: the builder reuses the Pi cable, as in the forum thread above)."
  - id: dev.usb-peripheral
    model: mdl.usb.nano-stack
    power:
      rail: rail.jetson-header-5v
      draw: {value: 5, unit: W}
    physical:
      mount_frame: base_link
    owner: you
    provenance:
      witness: w0
      source: "developer.download.nvidia.com/embedded/L4T/r32-3-1_Release_v1.0/Jetson_Nano_Developer_Kit_User_Guide.pdf"
      locked_at: 2026-10-15
      note: "One USB stack at its 1 A limit: 1 A x 5 V = 5 W. Worst case, not a measured device. Even a 0.5 A camera (2.5 W, 13.75 W total) exceeds the 12.5 W pin; 0.25 A of USB load is enough for NO-GO; the 5 V is the header rail, assumed (the guide does not state the USB stack supply voltage)."
  - id: dev.2d-lidar
    model: mdl.lidar.lds-02
    power:
      rail: rail.controller-5v
      draw: {value: 1.2, unit: W}
      modes:
        - name: start-up
          draw: {value: 2, unit: W}
    physical:
      mount_frame: base_scan
    owner: you
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/platform/turtlebot3/appendix_lds_02/"
      locked_at: 2026-10-15
      note: "Running 240 mA x 5 V = 1.2 W; start-up 400 mA x 5 V = 2 W. Assumed wiring: the lidar takes its 5 V from the OpenCR 5 V output (not confirmed on the page read)."
  - id: dev.left-wheel-motor
    model: mdl.servo.xl430-w250
    power:
      rail: rail.battery-input
      draw: {value: 14.43, unit: W}
      modes:
        - name: standby
          draw: {value: 0.577, unit: W}
    physical:
      mount_frame: wheel_left_link
    owner: you
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/dxl/x/xl430-w250/"
      locked_at: 2026-10-15
      note: "Stall 1.3 A x 11.1 V = 14.43 W (worst case, wheel blocked); standby 52 mA x 11.1 V = 0.5772 W, rounded to 0.577 W. Assumed: the Dynamixel ports pass the battery voltage straight through (the OpenCR page read does not state the port voltage)."
  - id: dev.right-wheel-motor
    model: mdl.servo.xl430-w250
    power:
      rail: rail.battery-input
      draw: {value: 14.43, unit: W}
      modes:
        - name: standby
          draw: {value: 0.577, unit: W}
    physical:
      mount_frame: wheel_right_link
    owner: you
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/dxl/x/xl430-w250/"
      locked_at: 2026-10-15
      note: "Stall 1.3 A x 11.1 V = 14.43 W (worst case, wheel blocked); standby 52 mA x 11.1 V = 0.5772 W, rounded to 0.577 W. Assumed: the Dynamixel ports pass the battery voltage straight through (the OpenCR page read does not state the port voltage)."
topology:
  hosts:
    - id: motor-controller
      notes: OpenCR 1.0
    - id: companion-computer
      notes: Jetson Nano
  rails:
    - id: rail.battery-input
      voltage: {value: 11.1, unit: V}
      capacity: {value: 111, unit: W}
      current_limit: {value: 10, unit: A}
      upstream: battery
      provenance:
        witness: w0
        source: "emanual.robotis.com/docs/en/parts/controller/opencr10/"
        locked_at: 2026-10-15
        note: "Input fuse 125 V 10 A (LittleFuse 0453010); 10 A x 11.1 V battery = 111 W. Battery 11.1 V from the Burger spec table (features page)."
    - id: rail.controller-12v
      capacity: {value: 55, unit: W}
      upstream: rail.battery-input
      provenance:
        witness: w0
        source: "emanual.robotis.com/docs/en/parts/controller/opencr10/"
        locked_at: 2026-10-15
        note: "12 V output max 4.5 A (54 W); the 12 V is regulated from the 5-24 V input and can step up from the 11.1 V pack, so the rail's voltage is left unscored rather than flagged as a false step-up; the page also states total consumption on the 12 V and 5 V ports must not exceed 55 W, used as this trunk's capacity. Converter efficiency is not published: the schema default 1.0 is left in place (assumed, no loss modeled). The features page lists the 12 V connector as 1 A; the OpenCR page's 4.5 A is used."
    - id: rail.controller-5v
      voltage: {value: 5, unit: V}
      capacity: {value: 20, unit: W}
      current_limit: {value: 4, unit: A}
      upstream: rail.controller-12v
      provenance:
        witness: w0
        source: "emanual.robotis.com/docs/en/parts/controller/opencr10/"
        locked_at: 2026-10-15
        note: "5 V output max 4 A: 4 A x 5 V = 20 W; supplied from the regulated 12 V output (hence upstream)."
    - id: rail.jetson-header-5v
      voltage: {value: 5, unit: V}
      capacity: {value: 12.5, unit: W}
      current_limit: {value: 2.5, unit: A}
      upstream: rail.controller-5v
      provenance:
        witness: w0
        source: "developer.download.nvidia.com/embedded/L4T/r32-3-1_Release_v1.0/Jetson_Nano_Developer_Kit_User_Guide.pdf"
        locked_at: 2026-10-15
        note: "J41 expansion header: the two 5 V pins can each power the kit at 2.5 A. The TurtleBot3 Pi power cable lands on one pin (pin 4), so the feed is 2.5 A x 5 V = 12.5 W. Draw: 11.25 W Nano + 5 W USB stack = 16.25 W, i.e. 3.25 A, over by 3.75 W (0.75 A). Declared once, as the rail's current_limit: a separate 12.5 W budget on the same rail would report the same fault a second time."
  battery:
    # Burger spec table, emanual.robotis.com/docs/en/platform/turtlebot3/features/: "Lithium polymer 11.1V 1800mAh / 19.98Wh 5C".
    capacity: {value: 19.98, unit: Wh}
    voltage: {value: 11.1, unit: V}
budgets:
  - id: bud.power.battery-input
    kind: rail_power
    rail: rail.battery-input
    limit: {value: 111, unit: W}
    owner: you
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/parts/controller/opencr10/"
      locked_at: 2026-10-15
      note: "Equals the rail capacity: 10 A fuse x 11.1 V."
  - id: bud.power.controller-12v
    kind: rail_power
    rail: rail.controller-12v
    limit: {value: 55, unit: W}
    owner: you
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/parts/controller/opencr10/"
      locked_at: 2026-10-15
      note: "Equals the published 55 W total for the 12 V and 5 V ports."
  - id: bud.power.controller-5v
    kind: rail_power
    rail: rail.controller-5v
    limit: {value: 20, unit: W}
    owner: you
    provenance:
      witness: w0
      source: "emanual.robotis.com/docs/en/parts/controller/opencr10/"
      locked_at: 2026-10-15
      note: "Equals the published 5 V output: 4 A x 5 V."
