# Resizable rover: a four-wheel base stored in this lockfile, sized by the named numbers under
# `params:`. Change `half_wheelbase` (half the front-to-rear axle distance) or `half_track` (half
# the left-to-right wheel distance) and `lockwire check` moves the tip margin; both sides move
# together, a leading minus ("-half_wheelbase") puts a joint on the other side. Change a
# `chassis_*` size and the derived mass follows the volume.
# Every size and position is a design choice, not a maker spec. Chassis and wheels are solid
# 6061-T6 aluminium (a plate and four discs), so every mass is derived from the shapes and the
# cited density in `material.source` (lockwire.catalog row "Aluminium 6061-T6"); none is declared.
