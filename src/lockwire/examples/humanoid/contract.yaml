      source: "https://www.pololu.com/product/4095"
      locked_at: 2026-10-15
      note: "Pololu D36V50F12 (the converter in ToddlerBot's bill of materials, 'Step Down Power Converter 12V 4.5A'), fetched 2026-10-15: input 13.3 V to 50 V, output 12 V with 4% accuracy, 4.5 A at 36 V in (listed on the family page), typical efficiency 90% to 95%. 12 V x 4.5 A = 54 W. Pololu's 4.5 A is the 36 V input figure and is limited by heat; on a 14.8 V pack (13.3 V minimum input) 54 W is an optimistic ceiling."
