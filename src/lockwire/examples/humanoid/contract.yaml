topology:
  rails:
    - id: rail.battery-pack
      voltage: {value: 14.8, unit: V}
      capacity: {value: 370, unit: W}
      upstream: battery
      provenance:
        witness: w0
        source: "https://arxiv.org/abs/2502.00893 appendix 8.7"
        locked_at: 2026-10-15
        note: "Paper: 'The peak power output from the battery is 14.8 V x 25 A = 370 W, sufficient to power all the joints.' The DIY pack guide (docs/features/03_diy_battery.rst) gives 14.8 V nominal and an XT30 'max rated discharge rate 25A'. topology.battery is that DIY pack, 4 cells of 21700 at 5000 mAh (paper): 5.0 Ah x 14.8 V = 74.0 Wh."
    - id: rail.legs-12v
      voltage: {value: 12, unit: V}
      capacity: {value: 54, unit: W}
      current_limit: {value: 4.5, unit: A}
      upstream: rail.battery-pack
      efficiency: 0.9
      provenance:
        witness: w0
        source: "https://www.pololu.com/product/4095; https://arxiv.org/abs/2502.00893 appendix 8.7"
        locked_at: 2026-10-15
        note: "Legs converter. The paper's power board carries two 12 V step-down converters (Pololu D36V50F12, 12 V 4.5 A): 12 V x 4.5 A = 54 W. Efficiency 0.9 is the low end of Pololu's 'typical efficiency of 90% to 95%'. The split of servos between the two converters is author-chosen (not published)."
    - id: rail.upper-body-12v
      voltage: {value: 12, unit: V}
      capacity: {value: 54, unit: W}
      current_limit: {value: 4.5, unit: A}
      upstream: rail.battery-pack
      efficiency: 0.9
      provenance:
        witness: w0
        source: "https://www.pololu.com/product/4095; https://arxiv.org/abs/2502.00893 appendix 8.7"
        locked_at: 2026-10-15
        note: "Upper-body converter (arms, neck, waist). The paper's power board carries two 12 V step-down converters (Pololu D36V50F12, 12 V 4.5 A): 12 V x 4.5 A = 54 W. Efficiency 0.9 is the low end of Pololu's 'typical efficiency of 90% to 95%'. The split of servos between the two converters is author-chosen (not published)."
  # DIY 4-cell 21700 pack, 5000 mAh (paper appendix 8.7): 5.0 Ah x 14.8 V = 74.0 Wh. The stock
  # 2000 mAh LiPo is not used: its voltage is not published. 4S is 14.8 V nominal (DIY pack guide).
  battery:
    capacity: {value: 74.0, unit: Wh}
    voltage: {value: 14.8, unit: V}
budgets:
  - id: bud.legs-12v-power
    kind: rail_power
    rail: rail.legs-12v
    limit: {value: 54, unit: W}
    draw_mode: "stall"
    owner: locomotion
    provenance:
      witness: w0
      source: "https://www.pololu.com/product/4095"
      locked_at: 2026-10-15
      note: "Budget equals the converter rating: 12 V x 4.5 A = 54 W (an optimistic ceiling: 4.5 A is Pololu's 36 V-input, heat-limited figure; this pack is 14.8 V). Scored in the servos' stall mode, a worst case."
