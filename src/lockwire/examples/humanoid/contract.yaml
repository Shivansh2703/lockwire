    witness: w0
    source: https://raw.githubusercontent.com/hshi74/toddlerbot/e337f3b177b4b53abff70b31d1695a7b66cc6d2e/toddlerbot/descriptions/toddlerbot_2xm/toddlerbot_2xm.urdf
    locked_at: 2026-10-15
    note: "Link masses are the <mass> values of toddlerbot_2xm.urdf at hshi74/toddlerbot@e337f3b, read 2026-10-15. Links and joints are lockwire's own URDF import (lockwire start) of that file, with inertia and centre-of-mass columns dropped; structure_hash and source_sha256 are of that file. The 45 frame-only `*_body` links (no visual, joint-axis bodies) carry the URDF's own placeholder 0.001 kg (MuJoCo `balanceinertia`); left as the model records them, because a massless link with a massive child is one warning each in `lockwire check` (45 of them), not a folded frames line. A servo mounts on the link the scene script gives its id; servos whose own link has no box (hip-roll, shoulder-pitch, neck-yaw, waist-yaw) mount on the drawn link their joint hangs from."

families:
  - id: fam.companion.computer
    name: Companion computer
  - id: fam.servo.dynamixel
    name: Dynamixel servo
  - id: fam.regulator
    name: 12 V step-down converter
device_models:
  - id: mdl.servo.xc330-t288
    family: fam.servo.dynamixel
    provenance:
      witness: w0
      source: "https://emanual.robotis.com/docs/en/dxl/x/xc330-t288/"
      locked_at: 2026-10-15
      note: "Robotis e-Manual, XC330-T288, fetched 2026-10-15: Stall Torque 1.00 N.m at 12.0 V, 0.88 A; Input Voltage 6.5 ~ 12.0 V (recommended 11.1 V). Stall draw at 12 V = 12 V x 0.88 A = 10.56 W."
    input_voltage_range:
      min: {value: 6.5, unit: V}
      max: {value: 12.0, unit: V}
  - id: mdl.servo.2xc430-w250
    family: fam.servo.dynamixel
    provenance:
      witness: w0
      source: "https://emanual.robotis.com/docs/en/dxl/x/2xc430-w250/"
      locked_at: 2026-10-15
      note: "Robotis e-Manual, 2XC430-W250, fetched 2026-10-15: Stall Torque 1.8 N.m at 12.0 V, 1.4 A; Input Voltage 6.5 ~ 14.8 V (recommended 12.0 V); the page lists one stall figure for the whole two-axis module. Stall draw at 12 V = 12 V x 1.4 A = 16.8 W."
    input_voltage_range:
      min: {value: 6.5, unit: V}
      max: {value: 14.8, unit: V}
