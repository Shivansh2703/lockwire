# Humanoid starter: a ToddlerBot 2xm power tree, built from its published bill of materials.
# Based on ToddlerBot 2xm (MIT, https://github.com/hshi74/toddlerbot), Haochen Shi et al.,
# paper https://arxiv.org/abs/2502.00893 (appendix 8.7, power budget).
#
# What it is: the 24 Dynamixel servos of the 2xm build, the Jetson Orin NX computer, one 4S
# battery pack, and the two 12 V step-down converters of the power distribution board.
# What `lockwire check` finds: NO-GO, in the servos' stall mode, a worst case and not a nominal
# load. The paper states the pack's peak output (14.8 V x 25 A = 370 W) is "sufficient to power
# all the joints", but the motors sit behind two 12 V 4.5 A converters (2 x 54 W = 108 W). The
# 24 servos' e-Manual stall draw at 12 V adds up to 452 W; their standby (idle) draw is about 10 W.
# Every servo stalled at once never happens in practice. The NO-GO does not depend on how the
# servos are split between the converters (that split is author-chosen, see below): the 12
# lowest-stall servos alone (6 XC330-T288 at 10.56 W + 6 servos at 16.8 W = 63.36 + 100.8 =
# 164.16 W) already exceed one 54 W converter, so some converter is over whichever way they are
# split. The 54 W is itself an optimistic ceiling: Pololu's 4.5 A is at 36 V input and limited
# by heat, and this pack is 14.8 V (converter minimum input 13.3 V).
# This is an inference from the sourced numbers, not an incident reported by ToddlerBot users
# (the repo's issue tracker holds none about power).
# Not published, so author-chosen and marked human: which servo hangs on which converter.
# Legs on the legs converter and arms, neck and waist on the upper-body converter is an assumption.
# Note for a later version: the converters output 12 V +/- 4% (up to 12.48 V), above the
# XC330-T288's 12.0 V maximum input.
