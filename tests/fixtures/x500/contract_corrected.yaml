      locked_at: 2026-07-25
      note: "5 W is the published maximum component sum: 3 W base + 1 W AI + 0.5 W depth + 0.5 W encode; mass is unresolved."
  - id: dev.power-converter.castle-cc-bec-pro
    model: mdl.power-converter.castle-cc-bec-pro
    physical:
      mass: {value: 29, unit: g}
      mount_frame: x500_frame
    owner: power-integration
    provenance:
      witness: w0
      source: "https://www.castlecreations.com/en/cc-bec-pro-010-0004-01"
      locked_at: 2026-07-26
      note: "29 g installed mass. Input is connected to the 4S pack; the dedicated output is set to 5 V for the Jetson."
  - id: dev.flight-controller.pixhawk-6c
    model: mdl.flight-controller.pixhawk-6c
    physical:
      mass: {value: 59.3, unit: g}
      mount_frame: x500_frame
    owner: avionics-integration
    provenance:
      witness: w0
      source: docs.holybro.com/autopilot/pixhawk-6c/technical-specification
      locked_at: 2026-07-25
      note: "59.3 g is the published aluminium-case mass (plastic-case variant is 34.6 g; aluminium is used here since neither variant is otherwise selected). Board current draw remains UNKNOWN, so no power block is declared. No identity: the FC is the bus host, not a device on its own bus."
  - id: dev.power-module.pm02-v3
    model: mdl.power-module.pm02-v3
    physical:
      mass: {value: 20, unit: g}
      mount_frame: x500_frame
    owner: power-integration
    provenance:
      witness: w0
      source: docs/reference_robot_specs.md
      locked_at: 2026-07-25
      note: "20 g is the published PM02 (V3) mass. No power block declared: PM02 is the source of rail.pm02-5v and rail.servo-motor, not a consumer of either."
  - id: dev.magnetometer.ist8310
    model: mdl.magnetometer.ist8310
    identity:
      bus_ref: bus.i2c.external
      host: flight-controller
      address: "0x0E"
      strength: positional
    owner: navigation
    provenance:
      witness: w0
      source: "https://tw.isentek.com/userfiles/files/IST8310Datasheet_3DMagneticSensors.pdf"
      locked_at: 2026-09-06
      note: "IST8310 default I2C slave address is 0x0E (7-bit) when the CAD0/CAD1 address pins float, per the Isentek IST8310 datasheet. Mass and current draw are not separately published for the discrete part on this external bus. Only one device is declared at 0x0E on bus.i2c.external in this build, so no collision is present."
  # 4x motor + 4x ESC, declared with published masses and a
  # derived hover-only power draw (no max-current/max-thrust figure exists for
  # this motor anywhere checked -- Holybro's own kit and spare-parts pages
  # publish neither, so only a "hover" mode is declared, never a guessed "max").
  # Derivation shared by all four dev.motor.* entries: Holybro's X500 V2 kit
  # page (https://holybro.com/products/x500-v2-kits, fetched 2026-09-06)
  # publishes "Flight time: ~18 minutes hover with no additional payload.
  # Tested with 5000mAh Battery." Total hover power = battery energy / flight
  # time = (5000 mAh x 14.8 V nominal 4S = 74.0 Wh) / (18 min = 0.3 h) =
  # 246.68 W. That figure is the AIRCRAFT's total hover draw (propulsion +
  # the stock FC/GPS/RX avionics present during the test, no companion
  # payload); no separate motor-only or baseline-avionics-only number is
  # published, so it is divided evenly across the 4 motors as each motor's
  # propulsion-channel draw: 246.68 / 4 = 61.67 W. This modestly
  # overstates true per-motor draw (a few watts of baseline avionics are
  # folded in) but is the only published anchor available -- flagged here
  # rather than treated as an exact motor-only figure.
  - id: dev.motor.m1
    model: mdl.motor.holybro-2216-920kv
    physical:
      mass: {value: 80, unit: g}
      mount_frame: x500_frame
    power:
      rail: rail.servo-motor
      draw: {value: 61.67, unit: W}
      modes:
        - name: "hover"
          draw: {value: 61.67, unit: W}
    owner: propulsion
    provenance:
      witness: w0
      source: "https://holybro.com/products/x500-v2-kits; https://holybro.com/products/spare-parts-x500-v2-kit"
      locked_at: 2026-09-06
      note: "Mass 80 g from Holybro's spare-parts-store product JSON (SKU 520085). Hover draw 61.67 W derived from the kit page's published ~18 min hover flight-time figure -- see the shared derivation note above this block. No max-current/max-thrust figure is published; only 'hover' is declared."
  - id: dev.motor.m2
    model: mdl.motor.holybro-2216-920kv
    physical:
      mass: {value: 80, unit: g}
      mount_frame: x500_frame
    power:
      rail: rail.servo-motor
      draw: {value: 61.67, unit: W}
      modes:
        - name: "hover"
          draw: {value: 61.67, unit: W}
    owner: propulsion
    provenance:
      witness: w0
      source: "https://holybro.com/products/x500-v2-kits; https://holybro.com/products/spare-parts-x500-v2-kit"
      locked_at: 2026-09-06
      note: "Same derivation as dev.motor.m1 (see its provenance note)."
  - id: dev.motor.m3
    model: mdl.motor.holybro-2216-920kv
    physical:
      mass: {value: 80, unit: g}
      mount_frame: x500_frame
    power:
      rail: rail.servo-motor
      draw: {value: 61.67, unit: W}
      modes:
        - name: "hover"
          draw: {value: 61.67, unit: W}
    owner: propulsion
    provenance:
      witness: w0
      source: "https://holybro.com/products/x500-v2-kits; https://holybro.com/products/spare-parts-x500-v2-kit"
      locked_at: 2026-09-06
      note: "Same derivation as dev.motor.m1 (see its provenance note)."
  - id: dev.motor.m4
    model: mdl.motor.holybro-2216-920kv
    physical:
      mass: {value: 80, unit: g}
      mount_frame: x500_frame
    power:
