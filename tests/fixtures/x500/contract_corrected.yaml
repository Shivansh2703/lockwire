      bitrate: 8000000
      provenance:
        witness: w0
        source: docs/reference_robot_specs.md
        locked_at: 2026-07-26
        note: "8 Mbit/s is the Here3+ CAN-FD capability ceiling, not a verified configured rate. No configured rate is present in the source record, so this field must not be read as an operating-rate claim."
    - id: bus.uart.telemetry
