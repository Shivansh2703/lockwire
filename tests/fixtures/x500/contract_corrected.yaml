      locked_at: 2026-07-25
      note: "500 mm wheelbase; 1045 propeller; 1500 g payload without battery at 70% throttle; recommended pack is 4S 3000-5000 mAh, 20C+, XT60."
  - id: mdl.flight-controller.pixhawk-6c
    family: fam.flight-controller.autopilot
    provenance:
      witness: w0
      source: docs.holybro.com/autopilot/pixhawk-6c/technical-specification
      locked_at: 2026-07-25
      note: "Board current draw is unknown; aluminium/plastic case masses are variants, so no installed mass is selected."
  - id: mdl.companion.jetson-orin-nano
    family: fam.companion.sbc
    provenance:
      witness: w0
      source: "https://developer.nvidia.com/downloads/assets/embedded/secure/jetson/orin_nano/docs/jetson_orin_nano_devkit_carrier_board_specification_sp.pdf; https://developer.nvidia.com/downloads/jetson-orin-nx-module-series-data-sheet; NVIDIA power-mode docs; NVIDIA staff forum reply"
      locked_at: 2026-07-26
      note: "Bare module on a custom carrier: 5 V module VDD_IN; published power modes 7 W / 15 W / 25 W (docs/reference_robot_specs.md); 25 W mode implies 5 A peak. Module-only mass is UNKNOWN; the published 176 g dev-kit figure is the wrong product. input_voltage_range 4.75-5.25 V: the Orin Nano dev-kit carrier board spec (SP-11324-001 v1.3) says VDD_IN will be 5V only; the tolerance is NVIDIA's legacy-module figure from the Orin NX datasheet DS-10712-001 Table 5-1 (MODULE_ID low). Earlier 5-20 V was the wrong pin rating."
    input_voltage_range:
      min: {value: 4.75, unit: V}
      max: {value: 5.25, unit: V}
  - id: mdl.gnss.here3-plus
    family: fam.gnss.dronecan
    provenance:
      witness: w0
      source: irlock.com
      locked_at: 2026-07-25
      note: "DroneCAN at 8 Mbit/s; current draw is unknown. The 8 Hz update-rate figure is from an unnamed retailer source."
  - id: mdl.radio.rfd900x
    family: fam.radio.telemetry
    provenance:
      witness: w0
      source: "https://files.rfdesign.com.au/Files/documents/RFD900x%20DataSheet%20V1.2.pdf"
      locked_at: 2026-09-06
