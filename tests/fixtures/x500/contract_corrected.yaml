        locked_at: 2026-09-06
        note: "57600 bps is the RFD900x's own published default UART baud (user-selectable: 9600/19200/38400/57600/115200/400k/921k). This is the radio's own default, not a Holybro-Pixhawk-6C-specific figure (the board's own spec sheet states no default for this port) — declared per B1b (2026-09-06) since the radio, not the FC, sets the operating baud on this link."
    - id: bus.uart.companion
