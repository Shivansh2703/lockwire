# Corrected X500 V2 reference contract. This preserves the original demo
# contract and adds the separate BEC used to supply the bare Jetson module on
# a custom carrier; module-only mass is UNKNOWN.
schema_version: "0.2"
robot:
  name: Holybro X500 V2 PX4 reference quadrotor
  id: x500-v2-px4

model:
  source: docs/reference_robot_specs.md
  source_sha256: c8c9ce97375d59f6c40f006ecaa0522a943ebaaa0dd5b92533f3d72fbc9779ca
  structure_hash: f50e3e33faf883386c1acaf40adde5f4c8a16c9ce4bcd8729e4fdc38f3980cc7
  links:
    - name: x500_frame
      mass: {value: 610, unit: g}
      frame: x500_frame
  provenance:
    witness: w0
    source: holybro.com/products/x500-v2-kits
    locked_at: 2026-07-25
    note: "610 g is the published dry frame-kit weight; MTOW is unknown."

