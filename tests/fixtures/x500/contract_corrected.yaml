      source: docs.holybro.com/autopilot/pixhawk-6c/technical-specification
      locked_at: 2026-07-25
      note: "Primary Pixhawk 6C IMU. hard_limits from invensense.tdk.com/products/motion-tracking/6-axis/icm-42688-p/ (fetched 2026-09-06): accelerometer full-scale +/-16 g = +/-156.9064 m/s^2 (1 g = 9.80665 m/s^2); gyroscope full-scale +/-2000 dps = +/-34.9066 rad/s (2000 x pi/180)."
    hard_limits:
      accel_z: {lo: -156.9064, hi: 156.9064, unit: "m/s^2"}
      gyro_z: {lo: -34.9066, hi: 34.9066, unit: "rad/s"}
  - id: mdl.imu.bmi088
    family: fam.imu.mems
    provenance:
      witness: w0
      source: "docs.holybro.com/autopilot/pixhawk-6c/technical-specification + docs.px4.io"
      locked_at: 2026-07-25
      note: "Secondary Pixhawk 6C IMU; earlier units used the discontinued BMI055. hard_limits from bosch-sensortec.com/products/motion-sensors/imus/bmi088/ (fetched 2026-09-06): accelerometer full-scale +/-24 g = +/-235.3596 m/s^2; gyroscope full-scale +/-2000 dps = +/-34.9066 rad/s."
    hard_limits:
      accel_z: {lo: -235.3596, hi: 235.3596, unit: "m/s^2"}
      gyro_z: {lo: -34.9066, hi: 34.9066, unit: "rad/s"}
  - id: mdl.magnetometer.ist8310
    family: fam.magnetometer.mems
    provenance:
      witness: w0
      source: docs.holybro.com/autopilot/pixhawk-6c/technical-specification
