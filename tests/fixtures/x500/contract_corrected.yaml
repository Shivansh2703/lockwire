      locked_at: 2026-09-06
      note: "20 A continuous (Holybro kit page); burst current and DShot modes stay unconfirmed (search aggregation only). Mass 50 g, fetched first-hand 2026-09-06 from Holybro's own spare-parts-store product JSON (weight: 50.0, weight_unit: g) for SKU 520081 — supersedes the earlier UNKNOWN mass."
  - id: mdl.power-module.pm02-v3
    family: fam.power-module
    provenance:
