        locked_at: 2026-07-25
        note: "Pixhawk 6C's published port list includes 1x I2C; bitrate is not stated in the cited technical specification and is left UNKNOWN rather than assumed (I2C fast-mode 400 kHz is common but not confirmed for this board's external port)."
  rails:
    # PM02 regulated output: 5.2 V x 3 A = 15.6 W. Only the OAK-D Lite remains.
    - id: rail.pm02-5v
      voltage: {value: 5.2, unit: V}
      capacity: {value: 15.6, unit: W}
      provenance:
        witness: w0
        source: "PX4 hardware docs; Holybro; docs/reference_robot_specs.md"
        locked_at: 2026-07-26
        note: "PM02 regulated rail is published as 5.2 V at 3 A max; capacity is 5.2 V x 3 A = 15.6 W."
    # Pixhawk 6C TELEM1 per-port limiter, fetched from
    # docs.holybro.com/autopilot/pixhawk-6c/technical-specification. Quoted
    # sentence (Electrical data / Current Ratings): "Telem1 Max output current
    # limiter: 1.5A". The page states no separate peripheral 5V rating for the
    # TELEM ports, so voltage is the PM02's 5.2 V passed through the FC's power
    # input unchanged (efficiency 1.0, pass-through, not a converter). The
    # Pixhawk's power input stays on PM02 in this corrected build too (only the
    # Jetson moved to the dedicated CC BEC PRO). Capacity = 1.5 A x 5.2 V = 7.8 W.
    - id: rail.pixhawk-telem1-5v
      voltage: {value: 5.2, unit: V}
      capacity: {value: 7.8, unit: W}
      upstream: rail.pm02-5v
      efficiency: 1.0
      provenance:
        witness: w0
        source: docs.holybro.com/autopilot/pixhawk-6c/technical-specification
        locked_at: 2026-09-06
        note: "\"Telem1 Max output current limiter: 1.5A\" (Holybro Pixhawk 6C technical-specification page, Electrical data / Current Ratings, fetched 2026-09-06). No peripheral 5V rating is separately published for TELEM ports, so voltage is the PM02's 5.2 V passed through the Pixhawk's power input, not converted (efficiency 1.0, pass-through). Capacity = 1.5 A x 5.2 V = 7.8 W."
    # CC BEC PRO output set to 5 V. Conservatively rely on 13 A-class continuous
    # at 4S, so modeled capacity is 5 V x 13 A = 65 W (2.6× the 25 W draw).
    # Input is from the 4S pack (within the 12S maximum). The upstream conversion
    # edge is omitted because no sourced efficiency is available.
    - id: rail.cc-bec-pro-5v
      voltage: {value: 5, unit: V}
      capacity: {value: 65, unit: W}
      provenance:
        witness: w0
        source: "Castle Creations product page and user guide; docs/reference_robot_specs.md"
        locked_at: 2026-07-26
        note: "Output is set to 5 V. The 65 W modeled capacity is 5 V x the source record's conservative 13 A-class continuous reading at 4S."
    # Holybro specifies a 4S pack. 14.8 V is the nominal 4S value; the
    # PM02's 60 A continuous PCB rating gives 888 W pass-through capacity.
    # The upstream conversion edge is omitted because PM02 efficiency and a
    # sourced, specific 4S pack capacity are both UNKNOWN.
    - id: rail.servo-motor
      voltage: {value: 14.8, unit: V}
      capacity: {value: 888, unit: W}
      provenance:
        witness: w0
        source: "Holybro X500 V2 kit page; docs/reference_robot_specs.md"
        locked_at: 2026-07-26
        note: "Holybro specifies 4S; 14.8 V is the documented nominal 4S voltage, and 888 W is derived from 14.8 V x the PM02 published 60 A continuous PCB rating."
  battery:
    # Holybro publishes "4S 3000-5000 mAh, 20C+" as the recommended pack, with
    # the actual pack a builder's choice. The fixture switches from the
    # 3000 mAh lower-bound reading to the 5000 mAh pack Holybro's own kit page
    # cites for its published "~18 min hover" flight-time figure (see
    # bud.endurance.mission) -- that figure is the only real anchor available
    # for motor draw, so the declared battery must match the pack it was
    # measured on. 5000 mAh x 14.8 V nominal 4S = 74.0 Wh.
    capacity: {value: 74.0, unit: Wh}
    voltage: {value: 14.8, unit: V}

budgets:
  - id: bud.power.pm02-5v
    kind: rail_power
    rail: rail.pm02-5v
    limit: {value: 15.6, unit: W}
    owner: power-integration
    provenance:
      witness: w0
      source: "PX4 hardware docs; Holybro; docs/reference_robot_specs.md"
      locked_at: 2026-07-26
      note: "Budget limit equals the PM02 published regulated-rail capacity: 5.2 V x 3 A = 15.6 W."
  - id: bud.power.pixhawk-telem1
    kind: rail_power
    rail: rail.pixhawk-telem1-5v
    limit: {value: 7.8, unit: W}
    owner: power-integration
    provenance:
      witness: w0
      source: docs.holybro.com/autopilot/pixhawk-6c/technical-specification
      locked_at: 2026-09-06
      note: "Budget limit equals rail.pixhawk-telem1-5v's declared capacity: the published Telem1 per-port current limiter (1.5 A) x the PM02 pass-through voltage (5.2 V) = 7.8 W. Observed draw is the radio's declared draw (5.2 W transmit peak) — a real pass, 5.2 W <= 7.8 W."
  - id: bud.power.cc-bec-pro-5v
    kind: rail_power
    rail: rail.cc-bec-pro-5v
    limit: {value: 65, unit: W}
    owner: power-integration
    provenance:
      witness: w0
      source: "Castle Creations product page and user guide; docs/reference_robot_specs.md"
      locked_at: 2026-07-26
      note: "Budget limit equals the modeled BEC rail capacity: 5 V x the conservative 13 A-class continuous reading = 65 W."
  # Mode-aware companion on the BEC rail: selects the Jetson's published 7 W
  # mode. Arithmetic: 7 W <= 65 W — clean pass (keeps corrected fixture at 0/0).
  - id: bud.power.cc-bec-pro-5v.7w-mode
    kind: rail_power
    rail: rail.cc-bec-pro-5v
    limit: {value: 65, unit: W}
    draw_mode: "7W"
    owner: power-integration
    provenance:
      witness: w0
      source: "Castle Creations product page and user guide; docs/reference_robot_specs.md"
      locked_at: 2026-07-26
      note: "Duplicates the CC BEC Pro rail budget to exercise draw_mode selection against the Jetson's published 7 W mode (docs/reference_robot_specs.md)."
  - id: bud.power.servo-motor
    kind: rail_power
    rail: rail.servo-motor
    limit: {value: 888, unit: W}
    owner: power-integration
    provenance:
      witness: w0
      source: "Holybro X500 V2 kit page; docs/reference_robot_specs.md"
      locked_at: 2026-09-06
      note: "Budget limit equals the rail.servo-motor declared capacity: 14.8 V x the PM02's published 60 A continuous PCB rating = 888 W. Observed draw is the 4 motors' derived hover-only propulsion-channel power (see dev.motor.* provenance): 4 x 61.67 W = 246.68 W, well under capacity — a real, non-fabricated pass, not the motors' true worst-case (max-current) draw, which stays UNKNOWN."
  - id: bud.mass.payload
    kind: mass_total
    limit: {value: 1500, unit: g}
    sources: devices
    owner: airframe-integration
    provenance:
      witness: w0
      source: holybro.com/products/x500-v2-kits
      locked_at: 2026-09-06
      note: "1500 g is Holybro's published payload capacity 'without battery, at 70% throttle'. sources: devices sums only instantiated device masses: dev.gnss.here3-plus 51.8 g + dev.radio.rfd900x 14.5 g + dev.flight-controller.pixhawk-6c 59.3 g + dev.power-module.pm02-v3 20 g + dev.power-converter.castle-cc-bec-pro 29 g + 4x dev.motor.* 80 g (320 g) + 4x dev.esc.* 50 g (200 g) = 694.6 g; the frame link mass is not summed (sources=devices, not links). This total is now closer to the real installed mass than the earlier 174.1 g floor (motor/ESC masses are no longer excluded — see mdl.motor.holybro-2216-920kv / mdl.esc.holybro-20a provenance), but Jetson module mass and OAK-D Lite mass remain UNKNOWN and stay excluded rather than guessed."
  - id: bud.endurance.mission
    kind: endurance
    limit: {value: 15, unit: min}
    owner: flight-ops
    provenance:
      witness: w0
      source: "requirement, not a datasheet — owner: flight-ops"
      locked_at: 2026-09-06
      note: "15 min is a stated flight-ops mission requirement, not a vendor figure. B1b (2026-09-06) makes this a REAL endurance figure: topology.battery is now 74.0 Wh (the 5000 mAh pack Holybro's own kit page cites for its published ~18 min hover flight-time figure -- see dev.motor.* provenance for the full derivation), and total declared draw now includes propulsion: Jetson 25 W (rail.cc-bec-pro-5v) + OAK-D Lite 5 W (rail.pm02-5v) + 4x motor 61.67 W (rail.servo-motor, 246.68 W) + radio 5.2 W transmit-peak (rail.pixhawk-telem1-5v -> rail.pm02-5v, B10 2026-09-06) = 281.88 W nominal. Computed endurance = 74.0 / 281.88 = 0.2625 h (~15.75 min), which still clears the 15-min requirement, though by a thinner real margin than before the radio joined the power tree -- consistent with Holybro's own ~18-min hover figure being reduced by the added companion/camera/radio payload. This still covers hover-only draw (no climb/cruise/wind margin) and the per-motor draw is a derived approximation (see dev.motor.* provenance caveat), not an exact motor-only datasheet figure."
