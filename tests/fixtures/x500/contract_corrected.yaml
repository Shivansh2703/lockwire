        note: "OAK-D Lite's own datasheet (fetched first-hand 2026-09-06) lists the on-die USB3.1 Gen2 PHY as a 10 Gbps capability, but states in prose that 'data is then output to a host via USB 3.1 Gen1' — the actual operating link. 5 Gbit/s (USB 3.1 Gen1) is declared as the conservative, correctly-cited figure rather than the 10 Gbps controller-capability number."
    - id: bus.i2c.external
