devices:
  # MAVLink path: Jetson sits on the FC TELEM/UART serial bus. Power draw does
  # not require identity; the companion-computer host remains for the USB camera bus.
  - id: dev.companion.jetson-orin-nano
    model: mdl.companion.jetson-orin-nano
    identity:
      bus_ref: bus.uart.companion
      host: flight-controller
      strength: positional
    power:
      rail: rail.cc-bec-pro-5v
      draw: {value: 25, unit: W}
      modes:
        - name: "7W"
          draw: {value: 7, unit: W}
        - name: "15W"
          draw: {value: 15, unit: W}
        - name: "25W"
          draw: {value: 25, unit: W}
    owner: companion-compute
    provenance:
      witness: w0
      source: "NVIDIA module datasheet; NVIDIA power-mode docs; NVIDIA staff forum reply; docs/reference_robot_specs.md"
      locked_at: 2026-07-26
      note: "Bare module on a custom carrier. Nominal draw remains 25 W (fallback). Published Orin Nano power modes 7 W / 15 W / 25 W from docs/reference_robot_specs.md (table line citing NVIDIA docs; companion section). 5 A is derived from 25 W / 5 V module VDD_IN. Module-only mass is UNKNOWN: dev-kit 176 g is the kit, not the module. Identity is on bus.uart.companion (Pixhawk TELEM/UART); baud UNKNOWN."
  - id: dev.gnss.here3-plus
    model: mdl.gnss.here3-plus
    identity:
      bus_ref: bus.can.dronecan
      host: flight-controller
      strength: positional
    driver:
      topic: /fmu/out/vehicle_gps_position
      msg_type: px4_msgs/msg/SensorGps
      nominal_rate_hz: 8
      signals:
        latitude_deg: {field: latitude_deg, unit: deg}
        longitude_deg: {field: longitude_deg, unit: deg}
        gnss_altitude_m: {field: altitude_msl_m, unit: m}
    physical:
      mass: {value: 51.8, unit: g}
      mount_frame: x500_frame
    owner: navigation
    provenance:
      witness: w0
      source: "irlock.com; retailer source; PX4-Autopilot v1.16.2@54f0455ffcd755534539a7cf33a09a20bf71d29d src/modules/uxrce_dds_client/dds_topics.yaml (source-derived bridge declaration); PX4/px4_msgs v1.16.2@392e831c1f659429ca83902e66820d7094591410 msg/SensorGps.msg"
      locked_at: 2026-09-28
      note: "Mass and protocol are from irlock.com; update rate is retailer-sourced; current draw is unknown. The pinned PX4 bridge declaration maps /fmu/out/vehicle_gps_position to px4_msgs/msg/SensorGps. Its raw WGS84 latitude_deg/longitude_deg are degrees and altitude_msl_m is metres. This source-derived descriptor does not prove live topic emission. Native capture records local receive time, not the message timestamp."
  - id: dev.radio.rfd900x
    model: mdl.radio.rfd900x
    identity:
      bus_ref: bus.uart.telemetry
      host: flight-controller
      strength: positional
    physical:
      mass: {value: 14.5, unit: g}
      mount_frame: x500_frame
    power:
      rail: rail.pixhawk-telem1-5v
      draw: {value: 5.2, unit: W}
      modes:
        - name: "transmit"
          draw: {value: 5.2, unit: W}
        - name: "receive"
          draw: {value: 0.312, unit: W}
    owner: telemetry
    provenance:
      witness: w0
      source: "https://store.rfdesign.com.au/rfd-900x-modem/; docs.holybro.com/autopilot/pixhawk-6c/technical-specification"
      locked_at: 2026-09-06
      note: "Mass 14.5 g, fetched first-hand 2026-09-06 from RFDesign's own store product page ('Weight: 14.5g') — supersedes the earlier 14 g search-engine-paraphrase figure. B10 (2026-09-06): the radio now IS routed onto a modeled rail, rail.pixhawk-telem1-5v, since Holybro's own technical-specification page publishes a Telem1 per-port current limiter (1.5 A) that gives the missing rail capacity — see that rail's provenance for the quoted sentence and fetch date. draw is 1 A peak TX x 5.2 V = 5.2 W (transmit mode, also the fallback/worst mode); receive/standby mode is 60 mA x 5.2 V = 0.312 W."
    # link_budget: required_range/fade_margin_required are flight-ops mission
    # requirements (owner flight-ops), not datasheet figures. installation_loss
    # 2 dB is a declared feedline/connector assumption (mandatory field,
    # not measured). carrier_frequency is declared at the published band's
    # centre (902-928 MHz -> 915 MHz) as an explicit, labelled assumption: no
    # channel is fixed by the datasheet, so this is not a silent default.
    # tx_antenna/rx_antenna now declared. RFDesign's own
    # RFD900x modem bundle page publishes bundled antenna gains alongside the
    # radio itself ("4 x Antennas, 900MHz Half wave dipole 3dBi" among the
    # bundle's included antennas). The ground-station end is assumed to carry
    # the same bundled antenna (a labelled assumption, as for the transmit end).
    link_budget:
      required_range: {value: 2000, unit: m}
      fade_margin_required: {value: 10, unit: dB}
      installation_loss: {value: 2, unit: dB}
      carrier_frequency: {value: 915000000, unit: Hz}
      tx_antenna:
        gain: {value: 3, unit: dBi}
        provenance:
          witness: w0
          source: "https://store.rfdesign.com.au/rfd900x-modem-bundle-usb-c-hs-8517-62-00-90/"
          locked_at: 2026-09-06
          note: "RFD900x modem bundle page, bundle contents: '4 x Antennas, 900MHz Half wave dipole 3dBi'. Vehicle-end antenna; ground-station end assumed to use the same bundled dipole (labelled assumption, as for the transmit end)."
      rx_antenna:
        gain: {value: 3, unit: dBi}
        provenance:
          witness: w0
          source: "https://store.rfdesign.com.au/rfd900x-modem-bundle-usb-c-hs-8517-62-00-90/"
          locked_at: 2026-09-06
          note: "Same bundle page and figure as tx_antenna, assumed for the ground-station end (labelled assumption, as for the transmit end)."
  - id: dev.camera.oak-d-lite
    model: mdl.camera.oak-d-lite
    identity:
      bus_ref: bus.usb.companion
      host: companion-computer
      strength: positional
    power:
      rail: rail.pm02-5v
      draw: {value: 5, unit: W}
    owner: perception
    provenance:
      witness: w0
