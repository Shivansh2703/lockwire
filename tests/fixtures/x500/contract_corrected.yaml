      locked_at: 2026-09-06
      note: "2216, 920 KV, 3S-4S (Holybro kit page). Mass 80 g per motor, fetched first-hand 2026-09-06 from Holybro's own spare-parts-store product JSON (weight: 80.0, weight_unit: g) for SKU 520085 (CW) / 520086 (CCW) — this SUPERSEDES the earlier conflicting 63 g/~150 g retailer figures in docs/reference_robot_specs.md as a first-party Holybro number. Max continuous current and max power remain UNKNOWN (not published anywhere checked); hover-only draw is derived separately, see dev.motor.* provenance."
  - id: mdl.esc.holybro-20a
