    - name: b_to_c
      type: revolute
      parent: link_b
      child: link_c
      origin: {xyz: [0.4375, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
      axis: [0.0, 0.0, 1.0]
      limits: {lower: -1.0, upper: 1.0, effort: 5.0, velocity: 2.0}
    - name: c_to_d
      type: revolute
      parent: link_c
      child: link_d
      origin: {xyz: [0.375, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
      axis: [0.0, 0.0, 1.0]
      limits: {lower: -1.0, upper: 1.0, effort: 5.0, velocity: 2.0}
    - name: d_to_ground
      type: revolute
      parent: link_d
