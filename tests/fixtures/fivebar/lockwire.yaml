# Five links in one closed loop — outside the named set; must be NOT SCORED as five-bar.
#
# Every length below is an exact binary fraction, so the two Grashof sums are exact
# floats and the test can assert them as literals with no tolerance.
schema_version: "0.2"
robot:
  name: fivebar
model:
  source: fivebar.urdf
  source_sha256: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
  structure_hash: derived-from-recorded-structure
  links:
    - name: ground
      mass: {value: 1.0, unit: kg}
      com: [0.0, 0.0, 0.0]
      frame: ground
    - name: link_a
      mass: {value: 1.0, unit: kg}
      com: [0.0, 0.0, 0.0]
      frame: link_a
    - name: link_b
      mass: {value: 1.0, unit: kg}
      com: [0.0, 0.0, 0.0]
